<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEATHER RADAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-layer" id="bgLayer"></div>

  <div class="app-wrapper">

    <!-- ── CABEÇALHO ── -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">WEATHER RADAR</span>
      </div>
    </header>

    <!-- ── BUSCA ── -->
    <section class="search-section">
      <div class="search-bar">
        <input
          type="text"
          id="cityInput"
          class="search-input"
          placeholder="Buscar cidade…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="search-btn" id="searchBtn" aria-label="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button class="location-btn" id="locationBtn" aria-label="Usar minha localização">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
          </svg>
          <span>Minha localização</span>
        </button>
      </div>

      <!-- Histórico de buscas -->
      <div class="history-bar" id="historyBar"></div>
    </section>

    <!-- ── SPINNER DE CARREGAMENTO ── -->
    <div class="loader-wrapper" id="loader" hidden>
      <div class="spinner"></div>
    </div>

    <!-- ── MENSAGEM DE ERRO ── -->
    <div class="error-card" id="errorCard" hidden>
      <span class="error-icon">⚠</span>
      <p id="errorMessage">Cidade não encontrada.</p>
    </div>

    <!-- ── RESULTADO PRINCIPAL ── -->
    <main class="weather-main" id="weatherMain" hidden>

      <!-- Bloco hero: cidade + temperatura grande -->
      <div class="weather-hero">
        <div class="city-info">
          <h1 class="city-name" id="cityName">–</h1>
          <p class="city-sub">
            <span id="countryName">–</span>
            <span class="dot">·</span>
            <span id="queryTime">–</span>
          </p>
          <p class="condition-label" id="conditionLabel">–</p>
          <p class="timer-label">
              Atualizado há <strong id="timeCounter">0s</strong>
          </p>
        </div>

        <div class="temp-display">
          <img class="weather-icon" id="weatherIcon" src="" alt="ícone do clima" />
          <div class="temp-value">
            <span id="tempNum">–</span><sup class="temp-unit">°C</sup>
          </div>
          <p class="feels-like">Sensação <strong id="feelsLike">–</strong>°C</p>
        </div>
      </div>

      <!-- Cards de estatísticas -->
      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-icon">
            <!-- Umidade -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 2L6.5 10a6 6 0 1 0 11 0L12 2z"/>
            </svg>
          </div>
          <div class="stat-body">
            <span class="stat-label">Umidade</span>
            <span class="stat-value" id="humidity">–</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">
            <!-- Vento -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
            </svg>
          </div>
          <div class="stat-body">
            <span class="stat-label">Vento</span>
            <span class="stat-value" id="windSpeed">–</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">
            <!-- Visibilidade / Nuvens -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>
            </svg>
          </div>
          <div class="stat-body">
            <span class="stat-label">Nuvens</span>
            <span class="stat-value" id="clouds">–</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">
            <!-- Pressão -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="12" x2="15" y2="15"/>
            </svg>
          </div>
          <div class="stat-body">
            <span class="stat-label">Pressão</span>
            <span class="stat-value" id="pressure">–</span>
          </div>
        </div>

      </div>

    </main>

    <!-- Placeholder inicial (aparece antes de qualquer busca) -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🌍</div>
      <p>Digite o nome de uma cidade para começar</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
